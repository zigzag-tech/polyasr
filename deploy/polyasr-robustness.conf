[Unit]
# Never give up restarting. A start limit turned a transient boot-time VRAM
# race into a 16-hour outage on 2026-09-27 (three failures in five minutes,
# then systemd stopped trying). Restarts back off instead: 30s growing to 10min.
StartLimitIntervalSec=0

[Service]
ExecStartPre=/home/ubuntu/polyasr/cuda/venv/bin/python /home/ubuntu/polyasr/cuda/runtime_preflight.py
RestartSec=30
RestartSteps=5
RestartMaxDelaySec=600
